<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Disease Risk Prediction</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container">
    <h1>❤️ Heart Disease Risk Prediction</h1>
    <p class="subtitle">Enter patient clinical details below to get a prediction from the trained model.</p>

    <form id="predict-form">
      <div class="grid">
        <div class="field">
          <label for="age">Age</label>
          <input type="number" id="age" name="age" placeholder="e.g. 63" required>
        </div>

        <div class="field">
          <label for="sex">Sex</label>
          <select id="sex" name="sex" required>
            <option value="1">Male</option>
            <option value="0">Female</option>
          </select>
        </div>

        <div class="field">
          <label for="cp">Chest Pain Type (cp)</label>
          <select id="cp" name="cp" required>
            <option value="0">0 - Typical angina</option>
            <option value="1">1 - Atypical angina</option>
            <option value="2">2 - Non-anginal pain</option>
            <option value="3">3 - Asymptomatic</option>
          </select>
        </div>

        <div class="field">
          <label for="trestbps">Resting Blood Pressure (trestbps)</label>
          <input type="number" id="trestbps" name="trestbps" placeholder="e.g. 145" required>
        </div>

        <div class="field">
          <label for="chol">Serum Cholesterol (chol)</label>
          <input type="number" id="chol" name="chol" placeholder="e.g. 233" required>
        </div>

        <div class="field">
          <label for="fbs">Fasting Blood Sugar &gt; 120 mg/dl (fbs)</label>
          <select id="fbs" name="fbs" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </div>

        <div class="field">
          <label for="restecg">Resting ECG (restecg)</label>
          <select id="restecg" name="restecg" required>
            <option value="0">0 - Normal</option>
            <option value="1">1 - ST-T abnormality</option>
            <option value="2">2 - LV hypertrophy</option>
          </select>
        </div>

        <div class="field">
          <label for="thalach">Max Heart Rate Achieved (thalach)</label>
          <input type="number" id="thalach" name="thalach" placeholder="e.g. 150" required>
        </div>

        <div class="field">
          <label for="exang">Exercise-Induced Angina (exang)</label>
          <select id="exang" name="exang" required>
            <option value="0">No</option>
            <option value="1">Yes</option>
          </select>
        </div>

        <div class="field">
          <label for="oldpeak">ST Depression (oldpeak)</label>
          <input type="number" step="0.1" id="oldpeak" name="oldpeak" placeholder="e.g. 2.3" required>
        </div>

        <div class="field">
          <label for="slope">Slope of Peak Exercise ST (slope)</label>
          <select id="slope" name="slope" required>
            <option value="0">0 - Upsloping</option>
            <option value="1">1 - Flat</option>
            <option value="2">2 - Downsloping</option>
          </select>
        </div>

        <div class="field">
          <label for="ca">Number of Major Vessels (ca)</label>
          <select id="ca" name="ca" required>
            <option value="0">0</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select>
        </div>

        <div class="field">
          <label for="thal">Thalassemia (thal)</label>
          <select id="thal" name="thal" required>
            <option value="0">0</option>
            <option value="1">1 - Normal</option>
            <option value="2">2 - Fixed defect</option>
            <option value="3">3 - Reversible defect</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submit-btn">Predict</button>
    </form>

    <div id="result" class="result hidden"></div>
    <div id="error" class="error hidden"></div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
